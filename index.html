<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Хайфский Семейный Квиз</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen game board — Haifa bay at night; host screen for the TV, player screen for the phone. Single committed dark look. */
:root{
  --bay:#0b2233;        /* night sea */
  --bay-2:#123349;      /* raised surface */
  --line:#24506a;
  --foam:#eaf3f6;       /* text */
  --mist:#9db8c6;       /* secondary text */
  --gold:#e3b04b;       /* Bahai gardens gold — accent */
  --a1:#2f80c4;         /* А sea */
  --a2:#3c9a5f;         /* Б Carmel pine */
  --a3:#d9932c;         /* В gold-orange */
  --a4:#d4584f;         /* Г metronit-ish red */
  --ok:#4cc38a; --bad:#e2675e;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bay);color:var(--foam);font-family:var(--body);font-size:16px;
  background-image:radial-gradient(1200px 500px at 80% -10%, #1a4a66 0%, transparent 60%),
  radial-gradient(800px 400px at -10% 110%, #133a2a 0%, transparent 60%);}
#app{min-height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 24px;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:26px;height:26px;border-radius:50%;
  background:conic-gradient(var(--a1) 0 25%,var(--a2) 0 50%,var(--a3) 0 75%,var(--a4) 0)}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;color:var(--mist);font:700 13px var(--body);padding:7px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--gold);color:#1b1404}
main{flex:1;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(28px,6vw,58px);line-height:1.05;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--gold)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(20px,3.6vw,34px);line-height:1.2;margin:0;text-wrap:balance}
.eyebrow{font:800 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
p{margin:0;line-height:1.5;max-width:65ch}
.muted{color:var(--mist)}
.btn{font:800 17px var(--body);border:0;border-radius:14px;padding:14px 22px;cursor:pointer;background:var(--gold);color:#1b1404;align-self:flex-start;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--foam);border:1px solid var(--line)}
.btn:focus-visible,.seg button:focus-visible,.tile:focus-visible,input:focus-visible{outline:3px solid var(--foam);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--bay-2);border:1px solid var(--line);border-radius:18px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bay-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700}
.chip.me{border-color:var(--gold);color:var(--gold)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid.host{grid-template-columns:1fr}}
.tile{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;border-radius:16px;padding:16px;
  color:#fff;font:700 clamp(15px,2.2vw,20px)/1.3 var(--body);min-height:84px;cursor:default}
.tile b{font-family:var(--display);font-size:1.3em;line-height:1;flex:none;width:1.4em}
.tile span{min-width:0}
.t0{background:var(--a1)}.t1{background:var(--a2)}.t2{background:var(--a3)}.t3{background:var(--a4)}
button.tile{cursor:pointer}
.player .tile{min-height:110px}
.tile.dim{opacity:.28}
.tile.right{outline:4px solid var(--foam);outline-offset:3px}
.tile .cnt{margin-left:auto;font-family:var(--display);font-size:1.1em;padding-left:8px}
.tile.picked::after{content:"твой выбор";position:absolute;top:8px;right:10px;font:800 11px var(--body);letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:999px}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);width:100%;transition:width .25s linear}
.meta{display:flex;justify-content:space-between;gap:12px;font-weight:800;color:var(--mist);font-variant-numeric:tabular-nums}
.board{display:flex;flex-direction:column;gap:8px;counter-reset:r}
.board div{display:flex;align-items:center;gap:12px;background:var(--bay-2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-weight:800}
.board div::before{counter-increment:r;content:counter(r);font-family:var(--display);color:var(--gold);width:1.6em}
.board div.me{border-color:var(--gold)}
.board .pts{margin-left:auto;font-variant-numeric:tabular-nums;font-family:var(--display);font-size:15px}
.why{border-left:4px solid var(--gold);padding:10px 14px;background:var(--bay-2);border-radius:0 12px 12px 0}
.big{font-family:var(--display);font-weight:900;font-size:clamp(40px,12vw,90px);line-height:1}
.ok{color:var(--ok)}.bad{color:var(--bad)}
input{font:700 20px var(--body);padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--bay-2);color:var(--foam);width:100%;max-width:420px}
.notice{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--mist);font-size:14px}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end;max-width:640px}
.podium div{background:var(--bay-2);border:1px solid var(--line);border-radius:14px 14px 0 0;padding:12px 8px;text-align:center;font-weight:800;min-width:0;overflow-wrap:anywhere}
.podium .p1{height:190px;border-color:var(--gold)}.podium .p2{height:150px}.podium .p3{height:120px}
.podium strong{display:block;font-family:var(--display);font-size:28px;color:var(--gold)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header>
    <div class="brand"><i aria-hidden="true"></i>Хайфский Квиз</div>
    <div class="seg" id="mode" hidden>
      <button type="button" id="m-host" aria-pressed="true">Ведущий</button>
      <button type="button" id="m-player" aria-pressed="false">Игрок</button>
    </div>
  </header>
  <main id="main">
    <span class="eyebrow">Суржик-иврит спешл · 12 вопросов</span>
    <h1>Подключаемся к&nbsp;<em>Кармелю</em>…</h1>
    <p class="muted">Секунду, загружаем игру.</p>
  </main>
</div>

<script>
const QS=[
 {q:"Кто в Хайфе настоящий бааль-абайт (хозяин) города, перед кем даже мэрия כבוד עושה?",o:["Мэр города со свитой","Хабадники на Адаре","Хазирей бар (дикие кабаны)","Водители метронита"],a:2,why:"Хазирей бар — кабаны. Без вариантов."},
 {q:"Шо таке знаменитый хайфский Кармелит на самом деле?",o:["Полноценное метро на 100 станций","Наклонная подземная маршрутка в 6 остановок","Секретный бункер Армии Обороны","Фуникулёр для доставки фалафеля"],a:1,why:"Наклонная маршрутка, 6 станций."},
 {q:"Главное правило хайфской топографии: куда бежать, если ты заблудился?",o:["Шукай Бахайские сады — они кругом","Иди просто вниз — там точно ям (море)","Спроси кабана, він тут местный","Садись на метронит и молись"],a:1,why:"Иди вниз — там точно море."},
 {q:"Шо робить типичный хайфовчанин в пятницу вечером (йом шиши ба-эрев)?",o:["Едет тусить до утра в Тель-Авив","Идёт спать в 21:00, бо город засыпает","Катается на Кармелите ради кайфа","Ловит кабанов в Вади Ниснас"],a:1,why:"Спать в 21:00 — город спит."},
 {q:"Бахайские сады (Ганим а-Бахаим) — это шо вообще за чудо света?",o:["19 террас перфекционизма, шоб туристы пыхтели на ступеньках","Самый большой огород петрушки на Ближнем Востоке","Место, де разрешено бегать по газонам босиком","Личный дачный участок мэра города"],a:0,why:"19 террас для одышки туристов."},
 {q:"Какой официальный спорт номер один у коренных жителей района Адар?",o:["Марафон по ступенькам вверх с авоськами с базара","Парусный спорт в порту","Бег от контролёров в зелёном метроните","Пляжный волейбол на Бат-Галим"],a:0,why:"Марафон по ступенькам с базара."},
 {q:"Ты заходишь в Вади Ниснас в шаббат утром. Твоя главная шлихут (миссия)?",o:["Купить магнитик на холодильник","Взять горячую питу с фалафелем у Мишеля или Закена","Искать парковку 4 часа и уехать голодным","Учить арабский язык по вывескам"],a:1,why:"Фалафель у Мишеля или Закена."},
 {q:"Район Неве-Шаанан — це шо вообще за специфическая локация?",o:["Квартал, де живут одни коты и студенты Техниона с красными глазами","Главный центр ближневосточной моды","Элитный курорт для олигархов","Официальный заповедник диких дикобразов"],a:0,why:"Коты и студенты Техниона."},
 {q:"Шо произойдёт, если ты зазевался и сел на метронит №1 вместо №3?",o:["Экспрессом приедешь в Иерусалим","Уедешь в Крайот и вернёшься в Хайфу к пенсии","Водитель развернётся лично для тебя","Тебя депортируют за невнимательность"],a:1,why:"Уедешь в Крайот до пенсии."},
 {q:"Шо такое знаменитый «хайфский воздух» в районе Чек-Поста?",o:["Свежий морской бриз с нотками лаванды","Вся таблица Менделеева, но мы говорим «пахнет морем»","Горный альпийский озон с Кармеля","Неповторимый аромат свежего бурекаса"],a:1,why:"Таблица Менделеева = «запах моря»."},
 {q:"На Мерказ а-Кармель кабан встал на тротуаре и буравит взглядом твой пакет из Супера:",o:["Сказать: «Бетэавон, ахи!» и вежливо отдать весь пакет","Подойти и почухать за ушком","Показать ему синий теудат зеут","Вызвать полицию (она отдаст свой пакет)"],a:0,why:"«Бетэавон, ахи!» + пакет."},
 {q:"Главный неоспоримый плюс жизни в Хайфе по сравнению с Тель-Авивом:",o:["Дешевле шхирут (аренда) и в 22:00 тишина, бо все спят","Круглосуточные рейвы на каждом перекрёстке","Идеально плоский город без единой ступеньки","Летом совершенно отсутствует влажность"],a:0,why:"Шхирут дешевле и в 22:00 тишина."}
];
const L=["А","Б","В","Г"], TL=30000;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let db=null,room=null,user=null,uid=null,isEditor=false;
let mode="player";                  // "host" | "player"
let S=null;                         // game state {v,phase,q,round,startedAt}
let dbState=null,presState=null;
let roster={};                      // key -> {name,answers,round}
let me={name:ls.get("hq-name","")}, myAns={};
let seen=ls.get("hq-seen",{});      // "round:q" -> local ms when question appeared
let lastView="";

function pts(i,ans){const a=ans&&ans[i];if(!a)return 0;if(a[0]!==QS[i].a)return 0;return 500+Math.round(500*Math.max(0,1-a[1]/TL));}
function counted(i){if(!S)return false;return S.phase==="final"||i<S.q||(i===S.q&&S.phase==="reveal");}
function players(){return Object.entries(roster).filter(([k,p])=>S&&p.round===S.round).map(([k,p])=>({k,name:p.name,answers:p.answers||{},score:QS.reduce((s,_,i)=>s+(counted(i)?pts(i,p.answers):0),0)}));}
function ranked(){return players().sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));}
function myKey(){return uid||"local";}

/* ---------- state sources ---------- */
function pickState(){const c=[dbState,presState].filter(Boolean).sort((a,b)=>(b.v||0)-(a.v||0));const n=c[0]||null;
  if(n&&(!S||n.v!==S.v||n.round!==S.round)){const prev=S;S=n;onStateChange(prev);} else if(!S&&n){S=n;onStateChange(null);} render();}
function onStateChange(prev){
  if(mode==="player"){
    if(!prev||prev.round!==S.round){myAns=ls.get("hq-ans-"+S.round,{});}
    if(S.phase==="question"){const k=S.round+":"+S.q;if(!seen[k]){seen[k]=Date.now();ls.set("hq-seen",seen);}}
    sendPresence();
  } else { roster=Object.assign(ls.get("hq-roster-"+S.round,{}),roster); if(room)room.presence({role:"host",st:S}).catch(()=>{}); }
}
async function writeState(patch){
  const n=Object.assign({},S||{},patch,{v:((S&&S.v)||0)+1});
  S=n; dbState=n; render();
  if(db){try{await db.doc("game/state").set(n)}catch(e){showNote("Не получилось сохранить состояние игры: "+(e.code||e.message))}}
  if(room){room.presence({role:"host",st:n}).catch(()=>{});}
}
function sendPresence(){
  if(!room||mode!=="player")return;
  if(!me.name){room.presence({role:null,st:null}).catch(()=>{});return;}
  room.presence({role:"player",uid:uid||null,name:me.name.slice(0,24),round:S?S.round:null,answers:myAns,st:null}).catch(()=>{});
}
function onPeers(ch){
  let host=null;
  for(const p of ch.peers){
    const pr=p.presence||{};
    if(pr.role==="host"&&pr.st&&!p.isMe){if(!host||(pr.st.v||0)>(host.v||0))host=pr.st;}
    if(pr.role==="player"&&typeof pr.name==="string"&&pr.name){
      const k=(typeof pr.uid==="string"&&pr.uid)||p.peer;
      const ans={};const src=pr.answers&&typeof pr.answers==="object"?pr.answers:{};
      for(const i in src){const a=src[i];if(Array.isArray(a)&&a.length===2&&+a[0]>=0&&+a[0]<4)ans[+i]=[+a[0],Math.max(0,Math.min(TL,+a[1]||TL))];}
      roster[k]={name:pr.name.slice(0,24),round:pr.round,answers:ans};
    }
  }
  if(mode==="host"&&S)ls.set("hq-roster-"+S.round,roster);
  presState=host; pickState();
}

/* ---------- host actions ---------- */
function newRound(){return Math.random().toString(36).slice(2,8);}
function hostStart(){writeState({phase:"question",q:0,startedAt:Date.now()});}
function hostReveal(){if(S.phase==="question")writeState({phase:"reveal"});}
function hostNext(){if(S.q+1<QS.length)writeState({phase:"question",q:S.q+1,startedAt:Date.now()});else writeState({phase:"final"});}
function hostReset(){roster={};writeState({phase:"lobby",q:0,round:newRound(),startedAt:0});}
function answeredCount(){return players().filter(p=>p.answers[S.q]).length;}

/* ---------- player actions ---------- */
function join(name){name=(name||"").trim();if(!name)return;me.name=name.slice(0,24);ls.set("hq-name",me.name);lastView="";sendPresence();render();}
function answer(i){
  if(!S||S.phase!=="question"||myAns[S.q])return;
  const k=S.round+":"+S.q;const ms=Math.min(TL,Date.now()-(seen[k]||Date.now()));
  if(ms>=TL)return;
  myAns[S.q]=[i,ms];ls.set("hq-ans-"+S.round,myAns);sendPresence();render();
}

/* ---------- rendering ---------- */
function showNote(t){const n=document.createElement("div");n.className="notice";n.textContent=t;$("#main").prepend(n);}
function boardHTML(list,max){return '<div class="board">'+list.slice(0,max).map(p=>`<div class="${p.k===myKey()&&mode==="player"?"me":""}"><span>${esc(p.name)}</span><span class="pts">${p.score}</span></div>`).join("")+'</div>';}
function timeLeft(){if(!S||S.phase!=="question")return 0;
  const start=mode==="host"?S.startedAt:(seen[S.round+":"+S.q]||Date.now());return Math.max(0,TL-(Date.now()-start));}

function render(){
  const m=$("#main");
  if(mode==="player"&&!me.name){ if(lastView==="join")return; lastView="join";
    m.innerHTML=`<span class="eyebrow">Суржик-иврит спешл · 12 вопросов</span>
      <h1>Хайфский <em>семейный</em> квиз</h1>
      <p class="muted">Как тебя записать в таблицу лидеров?</p>
      <form id="jf" class="row" style="flex-direction:column;align-items:stretch;max-width:420px">
        <label for="nm" class="eyebrow">Имя или ник</label>
        <input id="nm" maxlength="24" autocomplete="nickname" placeholder="Например, Кабан из Адара">
        <button class="btn" type="submit">Войти в игру</button></form>
      ${room?"":'<div class="notice">Нет связи с комнатой игры. Откройте игру по приглашению на почту и войдите в claude.ai — тогда ваши ответы увидит ведущий.</div>'}`;
    $("#jf").addEventListener("submit",e=>{e.preventDefault();join($("#nm").value)});
    $("#nm").value=me.name||"";return;}
  lastView=mode+":"+(S?S.phase:"none");
  if(mode==="host")renderHost(m);else renderPlayer(m);
}

function renderHost(m){
  if(!S){m.innerHTML=`<h1>Готовим <em>лобби</em>…</h1>`;return;}
  const ps=ranked();
  if(S.phase==="lobby"){
    m.innerHTML=`<span class="eyebrow">Лобби · ждём игроков</span>
      <h1>Хайфский <em>семейный</em> квиз</h1>
      <p class="muted">Игроки открывают эту же ссылку на телефонах, вводят имя и попадают сюда. 12 вопросов, по 30 секунд. Правильный ответ даёт 500 очков и до 500 бонусных за скорость.</p>
      <div class="panel"><div class="meta"><span>Игроки в комнате</span><span>${ps.length}</span></div>
        <div class="chips" style="margin-top:12px">${ps.length?ps.map(p=>`<span class="chip">${esc(p.name)}</span>`).join(""):'<span class="muted">Пока никого. Первый, кто зайдёт, появится здесь.</span>'}</div></div>
      <div class="row"><button class="btn" id="go">Начать игру</button></div>
      ${room?"":'<div class="notice">Комната для игроков недоступна в этом окне. Экран всё равно работает как презентация: читайте вопросы вслух, а ответы пусть пишут на листочках.</div>'}`;
    $("#go").onclick=hostStart;return;}
  if(S.phase==="final"){m.innerHTML=finalHTML(ps)+`<div class="row"><button class="btn" id="again">Новая игра</button></div>`;$("#again").onclick=hostReset;return;}
  const Q=QS[S.q],rev=S.phase==="reveal";
  const cnt=[0,0,0,0];ps.forEach(p=>{const a=p.answers[S.q];if(a)cnt[a[0]]++;});
  m.innerHTML=`<div class="meta"><span>Вопрос ${S.q+1} из ${QS.length} · ${S.q<6?"Раунд 1":"Раунд 2 · Финальный штурм Кармеля"}</span><span id="ans">${rev?"":"Ответили: "+answeredCount()+" из "+ps.length}</span></div>
    ${rev?"":'<div class="bar"><i id="tb"></i></div>'}
    <h2>${esc(Q.q)}</h2>
    <div class="grid host">${Q.o.map((o,i)=>`<div class="tile t${i} ${rev?(i===Q.a?"right":"dim"):""}"><b>${L[i]}</b><span>${esc(o)}</span>${rev?`<span class="cnt">${cnt[i]}</span>`:""}</div>`).join("")}</div>
    ${rev?`<div class="why"><span class="eyebrow">Ключ ведущего</span><p>${L[Q.a]}. ${esc(Q.why)}</p></div>
      ${ps.length?`<span class="eyebrow">Таблица лидеров</span>`+boardHTML(ps,5):""}
      <div class="row"><button class="btn" id="nx">${S.q+1<QS.length?"Следующий вопрос":"Итоги игры"}</button></div>`
     :`<div class="row"><button class="btn" id="rv">Показать ответ</button><span class="muted big" id="tn" style="font-size:32px"></span></div>`}
    <div class="row"><button class="btn ghost" id="rs">Начать заново</button></div>`;
  if(rev)$("#nx").onclick=hostNext;else $("#rv").onclick=hostReveal;
  $("#rs").onclick=hostReset; tick();
}

function finalHTML(ps){
  const t=ps.slice(0,3);
  return `<span class="eyebrow">Финал · Кармель взят</span><h1>Итоги <em>квиза</em></h1>
    ${t.length?`<div class="podium">${[1,0,2].map(i=>t[i]?`<div class="p${i+1}"><strong>${i+1}</strong>${esc(t[i].name)}<div class="muted">${t[i].score}</div></div>`:"<span></span>").join("")}</div>`+boardHTML(ps,50):'<p class="muted">Никто не отвечал с телефона. Кабаны победили.</p>'}`;
}

function renderPlayer(m){
  if(!S){m.innerHTML=`<span class="eyebrow">Привет, ${esc(me.name)}</span><h1>Ждём <em>ведущего</em></h1><p class="muted">Игра начнётся, как только ведущий откроет её у себя.</p>${room?"":'<div class="notice">Нет связи с комнатой игры. Откройте игру по приглашению и войдите в claude.ai.</div>'}${renameBtn()}`;bindRename();return;}
  const ps=ranked(),mine=ps.find(p=>p.k===myKey());
  if(S.phase==="lobby"){m.innerHTML=`<span class="eyebrow">Ты в игре</span><h1>${esc(me.name)}, <em>сядь поудобнее</em></h1><p class="muted">Вопросы появятся, когда ведущий начнёт.</p><div class="chips">${ps.map(p=>`<span class="chip ${p.k===myKey()?"me":""}">${esc(p.name)}</span>`).join("")}</div>${renameBtn()}`;bindRename();return;}
  if(S.phase==="final"){m.innerHTML=finalHTML(ps);return;}
  const Q=QS[S.q],my=myAns[S.q],rev=S.phase==="reveal";
  if(rev){const ok=my&&my[0]===Q.a;const place=ps.findIndex(p=>p.k===myKey())+1;
    m.innerHTML=`<div class="meta"><span>Вопрос ${S.q+1} из ${QS.length}</span><span>${mine?mine.score:0} очков</span></div>
      <div class="big ${ok?"ok":"bad"}">${ok?"+"+pts(S.q,myAns):(my?"Мимо":"Без ответа")}</div>
      <p>Правильно: <b>${L[Q.a]}. ${esc(Q.o[Q.a])}</b></p>
      ${place?`<p class="muted">Ты на ${place}-м месте из ${ps.length}.</p>`:""}`;return;}
  m.innerHTML=`<div class="meta"><span>Вопрос ${S.q+1} из ${QS.length}</span><span id="tn"></span></div><div class="bar"><i id="tb"></i></div>
    <p style="font-weight:800;font-size:18px">${esc(Q.q)}</p>
    <div class="grid player">${Q.o.map((o,i)=>my?`<div class="tile t${i} ${my[0]===i?"picked":"dim"}"><b>${L[i]}</b><span>${esc(o)}</span></div>`:`<button type="button" class="tile t${i}" data-i="${i}"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join("")}</div>
    ${my?'<p class="muted">Ответ принят. Ждём, пока ведущий откроет правильный.</p>':""}`;
  m.querySelectorAll("button.tile").forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  tick();
}
function renameBtn(){return '<div class="row"><button class="btn ghost" id="rn">Сменить имя</button></div>';}
function bindRename(){const b=$("#rn");if(b)b.onclick=()=>{me.name="";lastView="";render();};}

function tick(){
  const left=timeLeft(),tb=$("#tb"),tn=$("#tn");
  if(tb)tb.style.width=(left/TL*100)+"%";
  if(tn)tn.textContent=S&&S.phase==="question"?Math.ceil(left/1000)+" c":"";
  if(mode==="host"&&S&&S.phase==="question"){
    const a=$("#ans"),n=players().length,c=answeredCount();
    if(a)a.textContent="Ответили: "+c+" из "+n;
    if(left<=0||(n>0&&c>=n))hostReveal();
  }
}
setInterval(tick,250);

/* ---------- mode switch ---------- */
function setMode(x){mode=x;$("#m-host").setAttribute("aria-pressed",x==="host");$("#m-player").setAttribute("aria-pressed",x==="player");
  lastView="";if(x==="host"&&room)room.presence({role:"host",st:S,name:null,answers:null}).catch(()=>{});else sendPresence();
  if(x==="player"&&S){myAns=ls.get("hq-ans-"+S.round,{});}
  render();}
$("#m-host").onclick=()=>setMode("host");$("#m-player").onclick=()=>setMode("player");

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude||!window.claude.use){render();return;}
  [db,room,user]=await Promise.all([claude.use("db"),claude.use("room"),claude.use("user")]);
  if(user){try{uid=await user.id()}catch(e){}try{isEditor=await user.canEdit()}catch(e){}}
  if(isEditor){$("#mode").hidden=false;setMode("host");}
  if(room){room.onPeers(onPeers,()=>{});}
  if(db){
    db.doc("game/state").onSnapshot(snap=>{const d=snap.exists?snap.data():null;
      if(d&&typeof d.phase==="string"&&Number.isInteger(d.q)&&d.q>=0&&d.q<QS.length)dbState=d;
      else if(!d&&mode==="host"&&!S)writeState({phase:"lobby",q:0,round:newRound(),startedAt:0});
      pickState();},()=>{});
  } else if(mode==="host"&&!S){writeState({phase:"lobby",q:0,round:newRound(),startedAt:0});}
  render();
})();
</script>

</body></html>
